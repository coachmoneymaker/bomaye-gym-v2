  <!-- ════════════════════════════════════════════════════════════════════
       TEMPORÄRE DEBUG-SEITE — nach Gebrauch loeschen.

       Zweck: die IDs der Bsport-Aktivitaeten dieses Studios sichtbar machen.
       Im Backoffice waren sie nicht auffindbar, in den Entwicklertools gingen
       sie zwischen Uebersetzungsdateien unter.

       Anlauf 1 hat aus jeder Antwort jedes Objekt mit id + name genommen und
       damit Bsports globales Kategorien-Woerterbuch ausgegeben (rund 2000
       generische, mehrsprachige Eintraege — "Kick Boxing" = 85). Auffaellig
       daran: es kamen nur zwei Gruppen heraus, "(Wurzel)" und "SCS". Eine
       Gruppe mit den Kursen des Studios fehlte voellig, obwohl der Kalender
       darunter "Bomaye Kickboxing" korrekt anzeigt. Die Daten des Studios
       stecken also nicht dort, wo sie erwartet wurden.

       Anlauf 2 geht deshalb drei unabhaengige Wege gleichzeitig — es reicht,
       wenn einer greift:
         A  aus dem gerenderten Kalender ueber Reacts Props
         B  aus den mitgeschnittenen Antworten, gezielt aus Termin-Objekten
         C  Volltextsuche nach "Bomaye" im Rohtext jeder Antwort

       Der Kalender wird ohne metaActivities-Filter gemountet
       (config.calendar = {}), zeigt also alle Kurse.

       Nicht verlinkt, nicht in der Sitemap, auf noindex.
       ════════════════════════════════════════════════════════════════════ -->

  <!-- Antworten mitschneiden. Muss stehen, BEVOR das Widget seine Daten holt.
       Jede Antwort von bsport.io wird protokolliert (Laenge, ob JSON, ob der
       Name "Bomaye" darin vorkommt) — auch die, die kein JSON sind. Der
       Rohtext wird nur dort behalten, wo "Bomaye" vorkommt; das sind die
       studio-eigenen Daten, und nur die werden gebraucht. -->
  <script data-cookieconsent="ignore">
  (function () {
    window.__bsAntworten = [];
    window.__bsProtokoll = [];

    function merken(url, text, quelle) {
      var t = text || '';
      var eintrag = {
        url: String(url), quelle: quelle, laenge: t.length,
        json: false, bomaye: t.indexOf('Bomaye') !== -1
      };
      window.__bsProtokoll.push(eintrag);
      var g = t.trim();
      if (!g || (g.charAt(0) !== '{' && g.charAt(0) !== '[')) return;
      try {
        var daten = JSON.parse(g);
        eintrag.json = true;
        window.__bsAntworten.push({ url: String(url), daten: daten, bomaye: eintrag.bomaye });
      } catch (e) { /* kein JSON, bleibt im Protokoll vermerkt */ }
    }

    var istBsport = function (u) { return String(u).indexOf('bsport') !== -1; };

    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function () {
        var url = (arguments[0] && arguments[0].url) || arguments[0];
        var p = origFetch.apply(this, arguments);
        if (istBsport(url)) {
          p.then(function (r) { r.clone().text().then(function (t) { merken(url, t, 'fetch'); }); })
           .catch(function () {});
        }
        return p;
      };
    }

    var oOpen = XMLHttpRequest.prototype.open;
    var oSend = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function (m, u) { this.__url = u; return oOpen.apply(this, arguments); };
    XMLHttpRequest.prototype.send = function () {
      var x = this;
      x.addEventListener('load', function () {
        if (istBsport(x.__url)) merken(x.__url, x.responseText, 'xhr');
      });
      return oSend.apply(this, arguments);
    };
  })();
  </script>

<body>

<h1>Bsport-Aktivitäten</h1>
<p class="hinweis">Temporäre Hilfsseite. Cookie-Banner akzeptieren, dann 5–10 Sekunden warten.</p>

<div id="status">Warte auf Einwilligung und Widget…</div>
<button type="button" onclick="bsAuswerten()">Neu einlesen</button>
<div id="ausgabe"></div>

<!-- Kalender ohne Filter: zeigt alle Kurse. Wird ausgelesen und dient zum Abgleich. -->
<div id="kalender">
  <h2>Kalender (alle Kurse, ohne Filter)</h2>
  <div id="bsport-widget-999001"></div>
</div>

<!-- Consent-Bruecke: muss immer laufen, sie gated selbst und trackt nicht. -->
<script data-cookieconsent="ignore" src="/assets/js/consent-bridge.js"></script>

<script>
(function () {
  'use strict';

  /* ── Warum hier drei Wege parallel laufen ──────────────────────────────
     Anlauf 1 hat aus jeder Antwort jedes Objekt mit id + name genommen und
     damit Bsports globales Kategorien-Woerterbuch ausgegeben (rund 2000
     generische, mehrsprachige Eintraege — "Kick Boxing" = 85). Auffaellig
     war dabei: es kamen NUR zwei Gruppen heraus, "(Wurzel)" und "SCS".
     Eine Gruppe mit den Kursen des Studios fehlte voellig, obwohl der
     Kalender darunter "Bomaye Kickboxing" korrekt anzeigt. Die Daten des
     Studios stecken also nicht dort, wo sie erwartet wurden.

     Deshalb jetzt drei voneinander unabhaengige Wege. Es reicht, wenn
     einer davon greift:

       A  aus dem gerenderten Kalender selbst — React haengt an jedes
          Element seine Props; darin steckt das Termin-Objekt mitsamt
          meta_activity_id. Das funktioniert unabhaengig davon, wie die
          Daten ueber das Netz kamen.
       B  aus den mitgeschnittenen Antworten, gezielt aus Termin-Objekten
          (erkennbar an meta_activity plus Datum/Trainer/Standort).
       C  Volltextsuche nach "Bomaye" im Rohtext jeder Antwort. Das findet
          die richtige Antwort ohne jede Annahme ueber Feldnamen und zeigt
          das gefundene Objekt roh an — notfalls laesst sich die ID von
          Hand ablesen.
     --------------------------------------------------------------------- */

  var STUDIO_VON = 200000;   /* Die Studio-IDs liegen im 244xxx-Bereich, der    */
  var STUDIO_BIS = 999999;   /* Rahmen ist bewusst weit, damit nichts wegfaellt. */
  var BUDGET = 300000;       /* Obergrenze besuchter Knoten, gegen Endlosläufe.  */

  function zahl(v) { return typeof v === 'number' && isFinite(v); }
  function text(v) { return (typeof v === 'string' && v.trim()) ? v.trim() : ''; }
  function sicher(s) {
    return String(s).replace(/[<>&]/g, function (c) {
      return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
    });
  }

  /* Felder, die ein Termin hat und ein Woerterbuch-Eintrag nie hat. */
  var TERMIN_MERKMALE = ['date_start', 'date_end', 'start_date', 'end_date',
    'datetime_start', 'datetime_end', 'start', 'end', 'coach', 'coaches',
    'establishment', 'capacity', 'session_type', 'booking_count', 'duration',
    'level', 'room', 'time_start'];

  function aktivitaetsId(o) {
    var ma = o.meta_activity;
    if (ma && typeof ma === 'object' && zahl(ma.id)) return ma.id;
    if (zahl(ma)) return ma;
    if (zahl(o.meta_activity_id)) return o.meta_activity_id;
    return null;
  }

  function hatAktivitaet(o) {
    return ('meta_activity' in o) || ('meta_activity_id' in o);
  }

  function istTermin(o) {
    if (!hatAktivitaet(o)) return false;
    for (var i = 0; i < TERMIN_MERKMALE.length; i++) {
      if (TERMIN_MERKMALE[i] in o) return true;
    }
    return false;
  }

  function nameVon(p) {
    if (!p || typeof p !== 'object') return '';
    return text(p.name) || text(p.title) || text(p.label) ||
           (text(p.first_name) + ' ' + text(p.last_name)).trim();
  }

  function trainerVon(o) {
    var q = o.coach || o.coaches || o.trainer;
    if (Array.isArray(q)) {
      var n = [];
      for (var i = 0; i < q.length; i++) { var e = nameVon(q[i]); if (e) n.push(e); }
      return n.join(', ');
    }
    return nameVon(q) || text(q);
  }

  function zeitVon(o) {
    var r = text(o.date_start) || text(o.datetime_start) || text(o.start_date) ||
            text(o.start) || text(o.time_start);
    if (!r) return '';
    var d = new Date(r);
    if (isNaN(d.getTime())) return r;
    var zwei = function (n) { return (n < 10 ? '0' : '') + n; };
    return zwei(d.getDate()) + '.' + zwei(d.getMonth() + 1) + '. ' +
           zwei(d.getHours()) + ':' + zwei(d.getMinutes());
  }

  /* Kurzfassung eines Objekts, damit sich Feldnamen von Hand lesen lassen. */
  function flach(o, tiefe) {
    tiefe = tiefe || 0;
    if (o === null || typeof o !== 'object') return JSON.stringify(o);
    if (tiefe >= 2) return Array.isArray(o) ? '[…]' : '{…}';
    if (Array.isArray(o)) {
      return '[' + o.slice(0, 3).map(function (e) { return flach(e, tiefe + 1); }).join(', ') +
             (o.length > 3 ? ', …' + o.length : '') + ']';
    }
    var teile = [];
    for (var k in o) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
      if (teile.length >= 25) { teile.push('…'); break; }
      teile.push(k + ': ' + flach(o[k], tiefe + 1));
    }
    return '{ ' + teile.join(', ') + ' }';
  }

  /* Ein Durchgang fuellt vier Sammlungen. besucht/budget verhindern, dass
     der Lauf in Zyklen oder DOM-Knoten haengenbleibt (React-Props!). */
  function gehen(wert, quelle, feld, s, tiefe, streng) {
    if (!wert || typeof wert !== 'object' || tiefe > 12) return;
    if (s.budget-- < 0) return;
    if (wert.nodeType || wert instanceof Window) return;   /* DOM nicht betreten */
    if (s.besucht.has(wert)) return;
    s.besucht.add(wert);

    if (Array.isArray(wert)) {
      for (var i = 0; i < wert.length; i++) gehen(wert[i], quelle, feld, s, tiefe + 1, streng);
      return;
    }

    var passt = streng ? istTermin(wert) : hatAktivitaet(wert);
    if (passt) {
      var id = aktivitaetsId(wert);
      if (id !== null) {
        var ma = wert.meta_activity;
        var name = (ma && typeof ma === 'object') ? nameVon(ma) : '';
        if (!name) name = nameVon(wert);
        var da = s.kurse[id];
        if (!da) s.kurse[id] = { name: name, quelle: quelle };
        else if (name.length > da.name.length) da.name = name;
        var zeit = zeitVon(wert);
        if (zeit || trainerVon(wert)) {
          s.termine.push({ id: id, name: name, zeit: zeit, trainer: trainerVon(wert) });
        }
      }
    }

    if (zahl(wert.id)) {
      var n2 = nameVon(wert);
      if (n2 && !s.alle[wert.id]) {
        s.alle[wert.id] = { name: n2, feld: feld || '(Wurzel)', quelle: quelle };
      }
    }

    /* Weg C: Objekte, deren eigene Texte "Bomaye" enthalten, roh aufheben. */
    if (s.roh.length < 6) {
      for (var k2 in wert) {
        if (!Object.prototype.hasOwnProperty.call(wert, k2)) continue;
        if (typeof wert[k2] === 'string' && wert[k2].indexOf('Bomaye') !== -1) {
          s.roh.push({ quelle: quelle, feld: feld || '(Wurzel)', objekt: flach(wert, 0) });
          break;
        }
      }
    }

    for (var k in wert) {
      if (Object.prototype.hasOwnProperty.call(wert, k)) {
        gehen(wert[k], quelle, k, s, tiefe + 1, streng);
      }
    }
  }

  /* Weg A: React haengt seine Props als __reactProps$… bzw. __reactFiber$…
     an jedes DOM-Element. Darin steckt das Termin-Objekt des Kurses. */
  function ausDemKalender(s) {
    var wurzel = document.getElementById('kalender');
    if (!wurzel) return 0;
    var knoten = wurzel.querySelectorAll('*');
    var geprueft = 0;
    for (var i = 0; i < knoten.length && i < 4000; i++) {
      var el = knoten[i];
      var eigene = Object.keys(el);   /* nur eigene Keys - die Prototypkette ist teuer */
      for (var j = 0; j < eigene.length; j++) {
        var k = eigene[j];
        if (k.indexOf('__reactProps$') !== 0 && k.indexOf('__reactFiber$') !== 0 &&
            k.indexOf('__reactInternalInstance$') !== 0) continue;
        geprueft++;
        var f = el[k];
        if (k.indexOf('__reactProps$') === 0) {
          gehen(f, 'Kalender (React-Props)', null, s, 8, false);
        } else {
          /* Fiber: eigene Props und die der Eltern, ein paar Ebenen hoch. */
          var n = 0;
          while (f && n++ < 10) {
            gehen(f.memoizedProps, 'Kalender (React-Fiber)', null, s, 8, false);
            gehen(f.memoizedState, 'Kalender (React-Fiber)', null, s, 8, false);
            f = f.return;
          }
        }
      }
    }
    return geprueft;
  }

  function gruppe(titel, hinweis) {
    var g = document.createElement('div');
    g.className = 'gruppe';
    var h = document.createElement('h2');
    h.textContent = titel;
    g.appendChild(h);
    if (hinweis) {
      var p = document.createElement('p');
      p.className = 'hinweis';
      p.textContent = hinweis;
      g.appendChild(p);
    }
    return g;
  }

  function zeile(g, links, rechts, zusatz, klasse) {
    var z = document.createElement('div');
    z.className = 'zeile' + (klasse ? ' ' + klasse : '');
    z.innerHTML = '<span class="id">' + sicher(links) + '</span> &nbsp; ' + sicher(rechts) +
      (zusatz ? ' <span class="zusatz">' + sicher(zusatz) + '</span>' : '');
    g.appendChild(z);
  }

  function klappe(titel) {
    var d = document.createElement('details');
    var z = document.createElement('summary');
    z.textContent = titel;
    d.appendChild(z);
    return d;
  }

  window.bsAuswerten = function () {
    var antworten = window.__bsAntworten || [];
    var protokoll = window.__bsProtokoll || [];
    var aus = document.getElementById('ausgabe');
    var s = { kurse: {}, termine: [], alle: {}, roh: [],
              besucht: new WeakSet(), budget: BUDGET };

    /* B und C - aus den Antworten */
    for (var i = 0; i < antworten.length; i++) {
      gehen(antworten[i].daten, antworten[i].url, null, s, 0, true);
    }

    /* A - aus dem gerenderten Kalender, mit eigenem Budget */
    var reactKnoten = 0;
    s.budget = BUDGET;
    try { reactKnoten = ausDemKalender(s); } catch (e) { /* egal, B und C bleiben */ }

    var kursIds = Object.keys(s.kurse).sort(function (a, b) { return a - b; });

    document.getElementById('status').textContent =
      antworten.length + ' JSON-Antworten (' + protokoll.length + ' Anfragen) · ' +
      reactKnoten + ' React-Knoten im Kalender · ' +
      kursIds.length + ' Kurse gefunden' +
      (protokoll.length === 0 ? '   ⚠ Nichts empfangen — Cookie-Banner akzeptiert?' : '');

    aus.innerHTML = '';

    /* 1 - das Gesuchte */
    var g1 = gruppe('1 · Kurse dieses Studios   ← das hier ist gesucht',
      'Nur Aktivitäten, die an einem echten Termin hängen — aus dem Kalender und aus den Antworten.');
    if (kursIds.length === 0) {
      zeile(g1, '—', 'Noch nichts gefunden. Kalender abwarten, dann „Neu einlesen“. Sonst Abschnitt 2 und 3 lesen.', '', 'leer');
    }
    kursIds.forEach(function (id) {
      zeile(g1, id, s.kurse[id].name || '(ohne Namen)', s.kurse[id].quelle.indexOf('Kalender') === 0 ? 'Kalender' : '');
    });
    aus.appendChild(g1);

    /* 2 - Rohfund "Bomaye": zeigt die echten Feldnamen, ohne jede Annahme */
    if (s.roh.length) {
      var g2 = gruppe('2 · Rohdaten mit „Bomaye“',
        'Die Objekte, in denen der Name des Studios vorkommt — hier lässt sich die ID notfalls von Hand ablesen.');
      s.roh.forEach(function (r) {
        var p = document.createElement('pre');
        p.textContent = '[' + r.feld + ']  ' + r.objekt;
        g2.appendChild(p);
      });
      aus.appendChild(g2);
    }

    /* 3 - einzelne Termine, zum Abgleich mit dem Kalender darunter */
    var gesehen = {};
    var termine = s.termine.filter(function (t) {
      var k = t.id + '|' + t.zeit + '|' + t.trainer;
      if (gesehen[k]) return false;
      gesehen[k] = 1;
      return true;
    }).slice(0, 80);
    if (termine.length) {
      var g3 = gruppe('3 · Einzelne Termine (zum Abgleich mit dem Kalender)',
        'Zeit und Trainer neben der ID — so lässt sich „Bomaye Kickboxing, 20:00, Alfonso Fusco“ eindeutig zuordnen.');
      termine.forEach(function (t) {
        zeile(g3, t.id, t.name || '(ohne Namen)',
          [t.zeit, t.trainer].filter(Boolean).join(' · '));
      });
      aus.appendChild(g3);
    }

    /* 4 - Reserve: alles im Studio-Zahlenbereich */
    var studioIds = Object.keys(s.alle).filter(function (id) {
      return Number(id) >= STUDIO_VON && Number(id) <= STUDIO_BIS;
    }).sort(function (a, b) { return a - b; });
    if (studioIds.length) {
      var g4 = gruppe('4 · Alle IDs ab ' + STUDIO_VON + ' (Reserve)',
        'Falls Abschnitt 1 leer bleibt: die studio-eigenen IDs liegen im 244xxx-Bereich.');
      studioIds.forEach(function (id) {
        zeile(g4, id, s.alle[id].name, s.alle[id].feld);
      });
      aus.appendChild(g4);
    }

    /* 5 - Diagnose: welche Anfragen gab es ueberhaupt */
    var d5 = klappe('5 · Anfragen an bsport.io (' + protokoll.length + ')');
    protokoll.forEach(function (p, n) {
      var z = document.createElement('div');
      z.className = 'zeile klein';
      z.textContent = (n + 1) + '. ' + (p.bomaye ? '★ ' : '') + p.quelle + ' · ' +
        p.laenge + ' Z. · ' + (p.json ? 'JSON' : 'kein JSON') + ' · ' + p.url;
      d5.appendChild(z);
    });
    var iframes = document.querySelectorAll('#kalender iframe');
    var zi = document.createElement('div');
    zi.className = 'zeile klein';
    zi.textContent = 'iframes im Kalender: ' + iframes.length +
      (iframes.length ? '  ⚠ Daten könnten im iframe geladen werden und wären dann hier unsichtbar.' : '');
    d5.appendChild(zi);
    aus.appendChild(d5);

    /* 6 - der alte, ungefilterte Blick mit dem globalen Woerterbuch */
    var uebrig = Object.keys(s.alle).filter(function (id) {
      return !(Number(id) >= STUDIO_VON && Number(id) <= STUDIO_BIS);
    }).sort(function (a, b) { return a - b; });
    var d6 = klappe('6 · Alles Übrige, ungefiltert (' + uebrig.length +
      ') — enthält Bsports globales Kategorien-Wörterbuch');
    uebrig.slice(0, 400).forEach(function (id) {
      var z = document.createElement('div');
      z.className = 'zeile klein';
      z.innerHTML = '<span class="id">' + id + '</span> &nbsp; ' +
        sicher(s.alle[id].name) + ' <span class="zusatz">' + sicher(s.alle[id].feld) + '</span>';
      d6.appendChild(z);
    });
    aus.appendChild(d6);
  };

  /* Widget ohne Filter mounten - gleiche Kette wie auf den anderen Seiten:
     Einwilligung abwarten, CDN laden, mounten. */
  function mounten() {
    var ziel = document.getElementById('bsport-widget-999001');
    if (typeof window.bomayeGateBsport !== 'function') {
      document.getElementById('status').textContent =
        'Consent-Brücke nicht geladen — Bsport bleibt aus.';
      return;
    }
    window.bomayeGateBsport(ziel, function () {
      if (!document.getElementById('bsport-cdn')) {
        var s = document.createElement('script');
        s.id = 'bsport-cdn';
        s.src = 'https://cdn.bsport.io/scripts/widget.js';
        document.head.appendChild(s);
      }
      var n = 0;
      var t = setInterval(function () {
        if (window.BsportWidget) {
          clearInterval(t);
          window.BsportWidget.mount({
            parentElement: 'bsport-widget-999001',
            companyId: 5473,
            franchiseId: null,
            dialogMode: 3,
            widgetType: 'calendar',
            showFab: false,
            fullScreenPopup: false,
            styles: undefined,
            config: { calendar: {} }   /* KEIN Filter: alle Kurse */
          });
          setTimeout(window.bsAuswerten, 3000);
          setTimeout(window.bsAuswerten, 8000);
        } else if (++n > 100) {
          clearInterval(t);
        }
      }, 150);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mounten);
  } else {
    mounten();
  }
  setInterval(function () { window.bsAuswerten(); }, 4000);
})();
</script>
